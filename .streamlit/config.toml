[client]
toolbarMode = "viewer"          # בלי כפתור Deploy ובלי תפריט

[browser]
gatherUsageStats = false

[server]
headless = true

# עיצוב: בהירה, בצבעי המעבדה (טורקיז), כדי שגם רכיבי Streamlit (טבלה, סרגל, מיקוד) יתאימו. צבעי הביטחון לא נגזרים ממנו.
[theme]
base = "light"
primaryColor = "#2D5F6B"
backgroundColor = "#F7F6F2"
secondaryBackgroundColor = "#F2F0EA"
textColor = "#1C2321"
borderColor = "#E3E0D7"
dataframeBorderColor = "#ECE9E1"
dataframeHeaderBackgroundColor = "#F5F3EE"
baseRadius = "8px"
font = "Heebo:https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
greenColor = "#2E7D4F"
orangeColor = "#B8762E"
yellowColor = "#B8762E"
redColor = "#B23A3A"
blueColor = "#4F6D7A"
